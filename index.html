<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f7eff2; /* Soft pinkish background */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 16px;
    }

    .profile-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background-color: #ffffff;
      border-radius: 20px;
      padding: 18px 22px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    .card-label {
      font-size: 11px;
      font-weight: 700;
      color: #9d526a; /* Dusky pink label color */
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-bottom: 6px;
      display: block;
    }

    .card-value {
      font-size: 15px;
      font-weight: 700;
      color: #2b2b2b;
      line-height: 1.3;
    }
  </style>
</head>
<body>

  <div class="profile-container">

    <div class="card">
      <span class="card-label">AGE</span>
      <p class="card-value">19 years old</p>
    </div>

    <div class="card">
      <span class="card-label">COURSE</span>
      <p class="card-value">Bachelor of Science in Computer Science</p>
    </div>

    <div class="card">
      <span class="card-label">YEAR LEVEL</span>
      <p class="card-value">2nd Year</p>
    </div>

    <div class="card">
      <span class="card-label">SCHOOL</span>
      <p class="card-value">Catanduanes State University</p>
    </div>

    <div class="card">
      <span class="card-label">COLLEGE</span>
      <p class="card-value">College of Information and Communications Technology</p>
    </div>

  </div>

</body>
</html>
